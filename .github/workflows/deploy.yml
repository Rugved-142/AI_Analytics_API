name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      LAMBDA_FUNCTION_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push Docker image
        run: |
          docker build -t $ECR_REPOSITORY:latest backend
          docker push $ECR_REPOSITORY:latest
      - name: Update Lambda function
        run: aws lambda update-function-code --function-name "$LAMBDA_FUNCTION_NAME" --image-uri "$ECR_REPOSITORY:latest"
      - name: Run smoke tests
        run: |
          python -m pip install httpx
          python - <<'PY'
          import os
          import httpx

          url = os.environ.get('SMOKE_TEST_URL')
          if url:
              r = httpx.get(f"{url}/health", timeout=10)
              r.raise_for_status()
          PY
